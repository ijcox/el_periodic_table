<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            padding: 0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: calc(100% - 20px);
            max-width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            margin: 0 auto;
        }
        
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 3px;
            background: white;
            width: 100%;
            max-width: 100%;
        }
        
        .element {
            aspect-ratio: 1;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            font-size: clamp(8px, 0.8vw, 14px);
        }
        
        .element:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }
        
        .atomic-number {
            font-size: 0.85em;
            font-weight: bold;
            position: absolute;
            top: 4px;
            left: 6px;
            opacity: 0.7;
        }
        
        .symbol {
            font-size: 2.2em;
            font-weight: bold;
            margin: 4px 0;
        }
        
        .name {
            font-size: 0.8em;
            text-align: center;
            opacity: 0.9;
            line-height: 1.1;
        }
        
        .mass {
            font-size: 0.75em;
            opacity: 0.7;
            margin-top: 2px;
        }
        
        /* Color coding by groups - colorblind friendly */
        .alkali { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); color: white; }
        .alkaline-earth { background: linear-gradient(135deg, #f1c40f 0%, #f39c12 100%); color: #333; }
        .transition { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); color: white; }
        .post-transition { background: linear-gradient(135deg, #16a085 0%, #138d75 100%); color: white; }
        .metalloid { background: linear-gradient(135deg, #d4a574 0%, #b8935c 100%); color: white; }
        .nonmetal { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); color: white; }
        .halogen { background: linear-gradient(135deg, #e91e63 0%, #c2185b 100%); color: white; }
        .noble-gas { background: linear-gradient(135deg, #00bcd4 0%, #0097a7 100%); color: white; }
        .lanthanide { background: linear-gradient(135deg, #ff6f00 0%, #e65100 100%); color: white; }
        .actinide { background: linear-gradient(135deg, #607d8b 0%, #455a64 100%); color: white; }
        
        .empty {
            background: transparent;
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }
        
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            padding: 5px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
            font-size: clamp(10px, 1vw, 14px);
        }
        
        .legend-color {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 1400px) {
            .symbol { font-size: 2em; }
            .name { font-size: 0.7em; }
        }
        
        @media (max-height: 900px) {
            .element { padding: 4px; }
            .symbol { font-size: 1.8em; }
            .name { font-size: 0.65em; }
            .atomic-number { font-size: 0.75em; }
            .mass { font-size: 0.65em; }
        }
        
        @media (max-height: 750px) {
            .element { padding: 3px; border-radius: 4px; }
            .symbol { font-size: 1.5em; }
            .name { font-size: 0.6em; }
            .atomic-number { font-size: 0.7em; }
            .mass { font-size: 0.6em; }
            .legend { margin-top: 5px; gap: 8px; }
            .legend-color { width: 20px; height: 20px; }
        }
    </style>
</head>

        function renderPeriodicTable() {
            const table = document.getElementById('periodicTable');
            const grid = Array(10).fill(null).map(() => Array(18).fill(null));

                grid[el.row - 1][el.col - 1] = el;
            });
            
            grid.forEach(row => {
                row.forEach(cell => {
                    const div = document.createElement('div');
                    
                    if (cell) {
                        div.className = `element ${cell.group}`;
                        div.onclick = () => makeCard(cell);
                        div.innerHTML = `
                            <div class="atomic-number">${cell.num}</div>
                            <div class="symbol">${cell.sym}</div>
                            <div class="name">${cell.name}</div>
                            <div class="mass">${cell.mass}</div>
                        `;
                    } else {
                        div.className = 'element empty';
                    }
                    
                    table.appendChild(div);
                });
            });
        }
